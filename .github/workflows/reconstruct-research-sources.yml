name: Reconstruct research sources

on:
  push:
    branches:
      - docs/engagement-learning-research-synthesis

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/engagement-learning-research-synthesis

      - name: Reconstruct archived research reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/research/engagement-learning/reports
          cat .transport/opusxz-00 .transport/opusxz-01 .transport/opusxz-02 .transport/opusxz-03 .transport/opusxz-04 | base64 -d | xz -d > docs/research/engagement-learning/reports/opus-5.md
          cat .transport/grokxz-00 .transport/grokxz-01 .transport/grokxz-02a .transport/grokxz-02b .transport/grokxz-03 .transport/grokxz-04 | base64 -d | xz -d > docs/research/engagement-learning/reports/grok.md
          test "$(git hash-object docs/research/engagement-learning/reports/opus-5.md)" = "606115265be05b73297b9b2c525bbf906bc671bc"
          test "$(git hash-object docs/research/engagement-learning/reports/grok.md)" = "90b1b504a92b1783413fc8e039460901c2272ab9"
          rm -rf .transport
          rm -f .github/workflows/reconstruct-research-sources.yml

      - name: Commit reconstructed sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: archive original engagement research reports"
          git push origin HEAD:docs/engagement-learning-research-synthesis
