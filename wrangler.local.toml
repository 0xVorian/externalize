# Local `wrangler d1` only. Git-connected Pages reads wrangler.toml (production
# D1 under env.production; preview unbound). `wrangler pages dev` rejects
# -c/--config, so local pages/e2e bind the same sqlite with
# `--d1 DB=<database_id>` (nil UUID). Wrangler 4.152 accepts that id for
# `d1 migrations apply --local`. Cloudflare's Pages+D1 snippet sometimes
# shows preview_database_id as the binding name ("DB") instead of a UUID.

name = "externalize"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
WEBAUTHN_RP_NAME = "Externalize"

[[d1_databases]]
binding = "DB"
database_name = "externalize-progress"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
